<!DOCTYPE html>

<style>
body[data-t="1"]{--bg:#06231d;--b2:#0c4a3b;--a:#e9c46a;--tx:#f5f1e3;--mut:#9ec5b7;--cd:#0005}

#hd{grid-area:hd;display:flex;align-items:center;justify-content:center;gap:2vw}#lg{height:11vh;display:none}

#cd{grid-area:cd}.mq{grid-area:mq}
body{gap:1.2vh 1.5vw}
body[data-l="1"]{grid-template-columns:1.1fr 1fr;grid-template-areas:"hd hd" "ck mb" "cd cd" "mq mq"}

body[data-l="4"] #an,body[data-l="5"] #an,body[data-l="6"] #an{display:block}

body[data-l="2"] .clock,body[data-l="4"] .clock,body[data-l="6"] .clock{font-size:11vh}
body[data-l="2"] .nx,body[data-l="4"] .nx,body[data-l="6"] .nx{margin:0}
body[data-l="2"] .nx span,body[data-l="4"] .nx span,body[data-l="6"] .nx span{font-size:5.5vh}

<div class="hd" id="hd"><img id="lg" alt=""><div><div class="ar">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div><h1 id="nm"></h1><div class="sub" id="kt"></div></div></div>
<div id="ck"><svg id="an" viewBox="-50 -50 100 100"></svg>
 <div><div class="clock" id="ck2"></div><div class="dt"><div id="gr"></div><div id="hj"></div></div><div class="nx"><b id="nn"></b><span id="nc"></span></div></div></div>

<div class="ov" id="ov"><h2 id="ot"></h2><div class="big" id="oc"></div><p id="op"></p></div>

<div id="set">
 <div id="pb"><h3>Masuk Admin</h3><label>PIN<input id="pi" type="password" placeholder="Masukkan PIN lalu tekan OK"></label><button id="bx">Batal</button></div>
 <div id="adm"><h3>Pengaturan Admin</h3><form id="fm" onsubmit="return false"></form>
  <h3>Upload File (tersimpan di browser perangkat ini)</h3>
  <label>Adzan (audio)<input type="file" accept="audio/*" onchange="up(this,'adzan')"></label>
  <label>Adzan Subuh (audio, opsional)<input type="file" accept="audio/*" onchange="up(this,'adzanS')"></label>
  <label>Iqomah (audio)<input type="file" accept="audio/*" onchange="up(this,'iqomah')"></label>

  <label>Logo masjid (gambar)<input type="file" accept="image/*" onchange="up(this,'logo')"></label>
  <div id="fl"></div>
  <button id="bs">Simpan</button><button id="bt">Simulasi Adzan</button><button id="br">Reset Simulasi</button><button id="bf">Layar Penuh</button><button id="bc">Tutup</button></div>
</div>

<script>
const N=["Imsak","Subuh","Terbit","Dhuha","Dzuhur","Ashar","Maghrib","Isya"],MAIN=[1,4,5,6,7];
const D={nama:"Masjid Hasanah Al Fatih",kota:"Bekasi, Jawa Barat",lat:-6.2383,lng:106.9756,tz:7,ih:2,hj:0,adz:4,solat:10,iq0:10,iq1:10,iq2:10,iq3:5,iq4:10,snm:"alert",tpl:0,lay:0,pin:"1234",almt:"",rek:"",khb:"",khi:"",khm:"",kht:"",kTgl:"",kSal:"",kIn:"",kOut:"",
k0:0,k1:0,k2:0,k3:0,k4:0,k5:0,k6:0,k7:0,urls:"",
hadits:"Sesungguhnya setiap amal tergantung pada niatnya. | HR. Bukhari dan Muslim\nBersuci itu separuh dari iman. | HR. Muslim\nSebaik-baik kalian adalah yang mempelajari Al-Qur'an dan mengajarkannya. | HR. Bukhari\nSholat berjamaah lebih utama daripada sholat sendirian dengan dua puluh tujuh derajat. | HR. Bukhari dan Muslim\nSenyummu di hadapan saudaramu adalah sedekah. | HR. Tirmidzi\nBarangsiapa beriman kepada Allah dan hari akhir, hendaklah berkata baik atau diam. | HR. Bukhari dan Muslim\nSesungguhnya bersama kesulitan ada kemudahan. | QS. Al-Insyirah: 6\nSesungguhnya Allah bersama orang-orang yang sabar. | QS. Al-Baqarah: 153",
run:"Luruskan dan rapatkan shaf • Matikan HP saat sholat • Jaga kebersihan masjid • Infaq dan sedekah dapat disalurkan melalui pengurus DKM"};
let C={...D};try{C={...D,...JSON.parse(localStorage.getItem("cfg")||"{}")}}catch(e){}
const $=i=>document.getElementById(i);
const LY=[["0","Otomatis (ganti tiap 15 menit)"],["1","1 - Klasik"],["2","2 - Menu Samping"],["3","3 - Media Layar Penuh"],["4","4 - Analog + Khotbah"],["5","5 - Analog Besar"],["6","6 - Kartu di Atas"]];
const TP=[["0","Otomatis ganti tiap hari"],["1","1 - Zamrud"],["2","2 - Malam Biru"],["3","3 - Terang"],["4","4 - Hitam Emas"],["5","5 - Ungu Senja"]];
const F=[["nama","Nama masjid","text"],["kota","Kota / wilayah","text"],["almt","Alamat (tampil di header)","text"],["rek","Info rekening infaq (tampil di header)","text"],["lat","Lintang (selatan = negatif)","number"],["lng","Bujur","number"],["tz","Zona waktu (WIB=7, WITA=8, WIT=9)","number"],["ih","Ihtiyati (menit)","number"],
...N.map((n,i)=>["k"+i,"Koreksi manual "+n+" (menit, boleh minus)","number"]),
["adz","Durasi layar adzan (menit)","number"],["solat","Durasi layar sholat gelap (menit)","number"],["hj","Koreksi tanggal Hijriah (hari)","number"],
["iq0","Iqomah Subuh (menit)","number"],["iq1","Iqomah Dzuhur (menit)","number"],["iq2","Iqomah Ashar (menit)","number"],["iq3","Iqomah Maghrib (menit)","number"],["iq4","Iqomah Isya (menit)","number"],
["snm","Mode suara","sel",[["adzan","Putar suara adzan & iqomah (file upload)"],["alert","Hanya notifikasi + bunyi alert"]]],["lay","Layout dashboard","sel",LY],["tpl","Template warna","sel",TP],["pin","PIN admin (kosong = tanpa PIN)","text"],
["khb","Khatib Jum'at berikutnya","text"],["khi","Imam Jum'at","text"],["khm","Muadzin Jum'at","text"],["kht","Tema khutbah","text"],["kTgl","Laporan kas: tanggal","text"],["kSal","Laporan kas: saldo (Rp)","text"],["kIn","Laporan kas: pemasukan (Rp)","text"],["kOut","Laporan kas: pengeluaran (Rp)","text"],["hadits","Hadits / nasihat (satu per baris: teks | sumber)","ta"],["urls","Link video/gambar online (satu per baris, opsional)","ta"],["run","Teks berjalan","text"]];
$("fm").innerHTML=F.map(([k,l,t,o])=>t=="sel"?`<label>${l}<select id="f_${k}">${o.map(([v,x])=>`<option value="${v}">${x}</option>`).join("")}</select></label>`:t=="ta"?`<label class="w">${l}<textarea id="f_${k}" rows="5"></textarea></label>`:`<label${k=="run"?' class="w"':""}>${l}<input id="f_${k}" type="${t}" step="any"></label>`).join("");
$("cd").innerHTML=N.map((n,i)=>`<div class="c" id="c${i}"><i>${n}</i><b></b></div>`).join("");

// ===== Hitung waktu sholat (parameter Kemenag RI: Subuh 20°, Isya 18°, Ashar Syafi'i, ihtiyati) =====
const R=Math.PI/180,sin=a=>Math.sin(a*R),cos=a=>Math.cos(a*R),tan=a=>Math.tan(a*R),acos=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,fix=(a,b)=>a-b*Math.floor(a/b);
function sun(jd){const d=jd-2451545,g=fix(357.529+.98560028*d,360),q=fix(280.459+.98564736*d,360),L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*d;
 return{d:Math.asin(sin(e)*sin(L))/R,eq:q/15-fix(Math.atan2(cos(e)*sin(L),cos(L))/R/15,24)}}
function calc(y,m,d){
 const jd=Date.UTC(y,m,d)/864e5+2440587.5-C.lng/360,S=t=>sun(jd+t),noon=12-S(.5).eq,off=C.tz-C.lng/15,lat=+C.lat;
 const A=(a,t,sg)=>{const s=S(t/24);return noon+sg*acos((-sin(a)-sin(lat)*sin(s.d))/(cos(lat)*cos(s.d)))/15};
 const f=(a,sg,t)=>{for(let i=0;i<3;i++)t=A(a,t,sg);return t};
 const asrA=Math.atan(1/(1+tan(Math.abs(lat-S(15/24).d))))/R,ih=C.ih*60,sc=h=>(h+off)*3600;
 const fj=sc(f(20,-1,5))+ih,sr=sc(f(.833,-1,6)),dz=sc(noon)+ih,as=sc(f(-asrA,1,15))+ih,mg=sc(f(.833,1,18))+ih,is=sc(f(18,1,19))+ih;
 return[fj-600,fj,sr,sr+1080,dz,as,mg,is].map((t,i)=>Math.round(t/60)*60+(+C["k"+i]||0)*60)}

// ===== Penyimpanan file (IndexedDB) =====
const db=new Promise((ok,no)=>{try{const r=indexedDB.open("jam",1);r.onupgradeneeded=()=>r.result.createObjectStore("m",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=no}catch(e){no(e)}});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction("m",m),q=f(t.objectStore("m"));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
let MED=[],AUD={};
async function loadM(){try{const a=await tx("readonly",s=>s.getAll())||[];MED.forEach(m=>URL.revokeObjectURL(m.u));
 MED=a.filter(r=>r.kind=="media").map(r=>({t:r.type.startsWith("video")?"v":"i",u:URL.createObjectURL(r.blob),id:r.id,n:r.name}));
 AUD={};a.filter(r=>r.kind!="media").forEach(r=>AUD[r.kind]={u:URL.createObjectURL(r.blob),n:r.name,id:r.id});const lg=$("lg");lg.style.display=AUD.logo?"block":"none";if(AUD.logo)lg.src=AUD.logo.u}catch(e){}}
async function up(inp,kind){try{for(const f of inp.files){const id=kind=="media"?"m"+Date.now()+Math.random().toString(36).slice(2,6):"a_"+kind;await tx("readwrite",s=>s.put({id,kind,name:f.name,type:f.type,blob:f}))}}catch(e){alert("Gagal menyimpan file di browser ini.")}inp.value="";await loadM();rf();slide()}
function rf(){$("fl").innerHTML=[["adzan","Adzan"],["adzanS","Adzan Subuh"],["iqomah","Iqomah"],["logo","Logo"]].map(([k,l])=>`<div>${l}: ${AUD[k]?AUD[k].n+` <button data-d="${AUD[k].id}">Hapus</button>`:"belum ada"}</div>`).join("")+"<div>Media: "+(MED.length?MED.map(m=>`${m.n}<button data-d="${m.id}">Hapus</button>`).join(""):"belum ada")+"</div>"}
$("fl").onclick=async e=>{const d=e.target.dataset.d;if(d){await tx("readwrite",s=>s.delete(d));await loadM();rf();slide()}};

// ===== Slide: video/gambar + hadits =====
let hi=0,li=0,st;
function slide(){clearTimeout(st);const mb=$("mb"),Hs=C.hadits.split("\n").filter(x=>x.trim()),
 M=[...MED,...C.urls.split("\n").map(u=>u.trim()).filter(Boolean).map(u=>({t:/\.(mp4|webm|m3u8)/i.test(u)?"v":"i",u}))];
 let L=[];if(M.length)M.forEach(m=>{L.push(m);if(Hs.length)L.push({t:"h"})});else if(Hs.length)L=[{t:"h"}];L.push({t:"a"});
 mb.innerHTML="";if(!L.length)return;const it=L[li++%L.length];
 if(it.t=="a"){const [n,a]=AH[ai++%AH.length].split("=");mb.innerHTML='<div class="hq">Asmaul Husna<span class="hs" style="font-size:6vh">'+n+'</span>'+a+'</div>';st=setTimeout(slide,12000)}else if(it.t=="h"){const [h,s]=Hs[hi++%Hs.length].split("|");mb.innerHTML=`<div class="hq">“${h.trim()}”<span class="hs">${(s||"").trim()}</span></div>`;st=setTimeout(slide,15000)}
 else if(it.t=="i"){const i=new Image();i.src=it.u;i.onerror=slide;mb.appendChild(i);st=setTimeout(slide,12000)}
 else{const v=document.createElement("video");v.src=it.u;v.muted=true;v.autoplay=true;v.playsInline=true;v.onended=slide;v.onerror=slide;mb.appendChild(v);v.play().catch(()=>{})}}

// ===== Jam & fase =====
const p2=n=>String(Math.floor(n)).padStart(2,"0"),hm=s=>{s=((s%86400)+86400)%86400;return p2(s/3600)+":"+p2(s%3600/60)};
const cd=s=>p2(s/3600)+":"+p2(s%3600/60)+":"+p2(s%60),cm=s=>p2(s/60)+":"+p2(s%60);
let sim=0,key="",T,T2,last="",ac,au=new Audio(),un=0;
const now=()=>new Date(Date.now()+sim*1e3+C.tz*36e5);
function init(){$("ht").style.display="none";try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
function beep(n){if(!ac)return;for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.8;o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.start(t);o.stop(t+.7)}}
function play(a,n){if(C.snm=="adzan"&&a){au.src=a.u;au.play().catch(()=>beep(n))}else beep(n)}
const dfmt=(o,l)=>{try{return new Intl.DateTimeFormat(l,{...o,timeZone:"UTC"})}catch(e){return null}};
function tick(){
 const n=now(),Y=n.getUTCFullYear(),M=n.getUTCMonth(),Dd=n.getUTCDate(),s=n.getUTCHours()*3600+n.getUTCMinutes()*60+n.getUTCSeconds(),jum=n.getUTCDay()==5,k=Y+"-"+M+"-"+Dd;
 if(k!==key){key=k;T=calc(Y,M,Dd);T2=calc(Y,M,Dd+1);T.forEach((t,i)=>$("c"+i).lastChild.textContent=hm(t));
  $("c4").firstChild.textContent=jum?"Jum'at":"Dzuhur";daily(Y,M,Dd,n);
