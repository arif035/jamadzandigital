function qrm(txt){

 put(4,4);put(d.length,8);d.forEach(x=>put(x,8));put(0,Math.min(4,D*8-b.length));while(b.length%8)b.push(0);for(let p=0;b.length<D*8;p^=1)put(p?17:236,8);

 const EX=[],LG=[];for(let i=0,x=1;i<255;i++){EX[i]=x;LG[x]=i;x<<=1;if(x>255)x^=285}
 const mul=(a,c)=>a&&c?EX[(LG[a]+LG[c])%255]:0;
 let g=[1];for(let i=0;i<ec;i++){const n=g.concat([0]);for(let j=0;j<g.length;j++)n[j+1]^=mul(g[j],EX[i]);g=n}
 const rs=a=>{const r=a.concat(Array(ec).fill(0));for(let i=0;i<a.length;i++){const c=r[i];if(c)for(let j=1;j<g.length;j++)r[i+j]^=mul(g[j],c)}return r.slice(a.length)};
 const bl=[],es=[];for(let i=0;i<nb;i++){const x=cw.slice(i*dc,(i+1)*dc);bl.push(x);es.push(rs(x))}
 const fin=[];for(let i=0;i<dc;i++)bl.forEach(x=>fin.push(x[i]));for(let i=0;i<ec;i++)es.forEach(x=>fin.push(x[i]));
